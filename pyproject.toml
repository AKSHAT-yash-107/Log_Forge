[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logforge"
version = "0.1.0"
description = "A zero-dependency local data engine for CSV, JSONL, and log data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logforge = "logforge.cli:main"

[tool.setuptools.packages.find]
include = ["logforge*"]
